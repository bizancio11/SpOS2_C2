name: Compilación y Validación de SpOS2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-core-logica:
    name: Validar Lógica del Sistema (Python 3.10)
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias esenciales
      run: |
        python -m pip install --upgrade pip
        # Instala dependencias si tienes un requirements.txt, o mutagen si la usas para audio
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Verificar sintaxis del núcleo
      run: |
        python -m py_compile core.py

  python-interface-pygame:
    name: Validar Interfaz Pygame (Python 3.11)
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependencias gráficas y de audio
      run: |
        python -m pip install --upgrade pip
        sudo apt-get update
        # Dependencias necesarias para ejecutar entornos con SDL2/Pygame en servidores headless
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev xvfb
        pip install pygame mutagen

    - name: Verificar compilación de la interfaz
      run: |
        python -m py_compile main.py
        # Simula un servidor de pantalla virtual (Xvfb) para comprobar que arranca sin crashear inmediatamente
        xvfb-run --server-args="-screen 0 1280x720x24" python3 main.py --run-script core.py &
        sleep 3
        kill $!

  compilar-imagen-docker:
    name: Construir Imagen O.S. Contenedorizada
    runs-on: ubuntu-latest
    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Compilar Imagen de Docker SpOS2
      run: |
        docker build -t spos2-operating-system:latest .
